# =============================================================================
# config_new_bysites.yaml — forward-simulation config
# =============================================================================
# Lean configuration for forward CLM-Microbe runs.
#
# Sections:
#   paths                — directories used by loaders
#   site_list            — list of sites
#   observations         — per-site xlsx paths
#   layers               — required by loader validator (values NOT used at runtime)
#   initial_layer_states — kept for parity (also unused at runtime)
#   constants            — the entries the forward model reads
#   parameters           — alpha_O2, alpha_hydrogen, audit switch + microbe_par_dict
#
# AUDIT SWITCH:
#   parameters.use_config_microbe_params: false  → DEFAULT.  Use the built-in
#                                                  microbial parameter values in
#                                                  the model
#                                                  (_init_microbial_parameters).
#
#   parameters.use_config_microbe_params: true   → Read the microbe_par_dict
#                                                  below instead; the model
#                                                  prints any divergences from
#                                                  the built-in values on
#                                                  startup.
# =============================================================================

